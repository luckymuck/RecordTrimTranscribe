[package]
name = "fasttalk-core"
version = "0.1.0"
edition = "2021"
description = "Browser/WASM port of FastTalk time-scale modification for speech"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
realfft = "3"
rustfft = "6"
wasm-bindgen = "0.2"

# Panics in WASM otherwise surface as an opaque "unreachable" trap with no
# message (CORE-12). WASM only; the native test build does not need it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
